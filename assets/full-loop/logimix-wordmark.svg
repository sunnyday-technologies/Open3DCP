    <tspan fill="#ffffff" font-family="Nulshock, Orbitron, Raleway, Arial, sans-serif">LOG</tspan><tspan fill="#97d700" font-family="Georgia, 'Times New Roman', serif" font-size="98" font-style="italic" font-weight="700">i</tspan><tspan fill="#ffffff" font-family="Nulshock, Orbitron, Raleway, Arial, sans-serif">MIX</tspan>
