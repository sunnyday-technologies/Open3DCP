[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "open3dcp-ingest"
# Version MAJOR.MINOR tracks the Open3DCP schema version this tool targets (currently v1.7).
version = "1.7.6"
description = "Public ingestion / conversion tool that translates external concrete datasets into the Open3DCP flat schema, with an honest fidelity score and a drop-nothing triage sidecar. Tool MAJOR.MINOR tracks the schema version."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Sunnyday Technologies" }]
keywords = ["concrete", "3d-printing", "3dcp", "open3dcp", "data-ingestion", "schema"]
dependencies = [
    "pyyaml>=5.4",
    "openpyxl>=3.0",
]

[project.urls]
Homepage = "https://open3dcp.org"
Repository = "https://github.com/sunnyday-technologies/Open3DCP"

[project.scripts]
open3dcp-ingest = "open3dcp_ingest.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["open3dcp_ingest"]
