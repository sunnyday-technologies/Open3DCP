name: Validate examples

# Guards the examples/ catalog: every stored dataset must carry a redistributable license + NOTICE +
# a valid record.json, the open3dcp-ingest examples must reproduce with only machine-precision serialization tolerance, and no commercial or
# non-public token may appear. Keeps examples honest and license-clean.

on:
  push:
    paths: [examples/**, scripts/check_examples.py, scripts/test_example_corrections.py, tools/ingest/**, crosswalk/**, .github/workflows/validate-examples.yml]
  pull_request:
    paths: [examples/**, scripts/check_examples.py, scripts/test_example_corrections.py, tools/ingest/**, crosswalk/**, .github/workflows/validate-examples.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the ingest tool
        run: pip install --quiet -e "tools/ingest[test]"
      - name: Test converter roundtrips and source preservation
        run: python -m pytest tools/ingest/tests -q
      - name: Validate examples
        run: python scripts/check_examples.py
      - name: Replay the BOxCrete example from pinned raw data
        shell: bash
        run: |
          example=examples/meta-sustainableconcrete
          replay=$(mktemp -d)
          trap 'rm -rf "$replay"' EXIT
          revision=$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["source_revision"])' "$example/record.json")
          curl --fail --silent --show-error --location --retry 2 --max-time 45 \
            "https://raw.githubusercontent.com/facebookresearch/SustainableConcrete/$revision/data/boxcrete_data.csv" \
            --output "$replay/boxcrete_data.csv"
          python "$example/build/extract.py" "$replay/boxcrete_data.csv" --out-dir "$replay"
          cmp "$example/build/meta-sustainableconcrete.csv" "$replay/meta-sustainableconcrete.csv"
      - name: Verify source-context and missingness regressions
        run: python scripts/test_example_corrections.py
